<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Campus Communication & Issue Management</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Navbar -->
    <header class="navbar">
      <div class="navbar-container">
        <div class="brand" onclick="window.navigateToTab('dashboard')">
          <div class="brand-icon">
            <i class="fas fa-university"></i>
          </div>
          <div>Campus Connect</div>
        </div>

        <ul class="nav-links">
          <li class="nav-item active" data-tab="dashboard">
            <i class="fas fa-chart-pie"></i> Overview
          </li>
          <li class="nav-item" data-tab="lost-found">
            <i class="fas fa-hand-holding-heart"></i> Lost & Found
          </li>
          <li class="nav-item" data-tab="announcements">
            <i class="fas fa-bullhorn"></i> Announcements
          </li>
          <li class="nav-item" data-tab="issues">
            <i class="fas fa-users"></i> Student Issues
          </li>
          <li class="nav-item" data-tab="management">
            <i class="fas fa-user-shield"></i> Management
          </li>
          <li class="nav-item" data-tab="admin">
            <i class="fas fa-cog"></i> Admin
          </li>
        </ul>

        <div class="nav-actions">
          <div class="search-input-group">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search posts, issues, announcements..." />
          </div>

          <!-- Notification Bell -->
          <div style="position:relative;">
            <div class="notification-bell" id="notifBell">
              <i class="far fa-bell"></i>
              <span class="notification-badge" id="notifBadge" style="display:none;">0</span>
            </div>
            
            <div class="notification-popover" id="notifPopover">
              <div class="popover-header">
                <span style="font-weight:700; font-size:0.9rem;">Campus Notifications</span>
                <span style="font-size:0.75rem; color:var(--primary); cursor:pointer;" onclick="state.notifications.forEach(n=>n.read=true); renderNotificationBadge();">Mark all read</span>
              </div>
              <div class="popover-body" id="popoverBody">
                <!-- Loaded dynamically -->
              </div>
            </div>
          </div>

          <!-- Quick Role Switcher Pill -->
          <div class="role-switcher-container">
            <div class="role-pill" id="rolePill">
              <span class="role-dot student"></span>
              <span>Regular Student</span>
              <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
            </div>
            
            <div class="role-dropdown" id="roleDropdown">
              <div class="role-dropdown-header">Switch Demo User Role</div>
              <div class="role-option selected" data-role="STUDENT">
                <span><i class="fas fa-user"></i> Regular Student</span>
                <i class="fas fa-check" style="font-size:0.75rem;"></i>
              </div>
              <div class="role-option" data-role="REPRESENTATIVE">
                <span><i class="fas fa-user-graduate"></i> Student Representative</span>
                <i class="fas fa-check" style="font-size:0.75rem;"></i>
              </div>
              <div class="role-option" data-role="MANAGEMENT">
                <span><i class="fas fa-university"></i> College Management</span>
                <i class="fas fa-check" style="font-size:0.75rem;"></i>
              </div>
              <div class="role-option" data-role="ADMIN">
                <span><i class="fas fa-shield-alt"></i> System Administrator</span>
                <i class="fas fa-check" style="font-size:0.75rem;"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content" id="tabContainer">
      <!-- Loaded dynamically by app.js -->
    </main>

    <!-- Modal Dialog Overlay -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-container">
        <div class="modal-header">
          <h3 id="modalTitle">Modal Action</h3>
          <i class="fas fa-times" style="cursor:pointer; color:var(--text-muted);" onclick="window.closeModal()"></i>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic form content -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="window.closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="window.confirmModal()">Submit</button>
        </div>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <!-- Application Bundle -->
  <script src="app.js"></script>
</body>
</html>
